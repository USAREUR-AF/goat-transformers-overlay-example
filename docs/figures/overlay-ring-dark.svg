<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 608" width="880" height="608" role="img" aria-labelledby="t d">
<title id="t">Twelve fictional formats fill the private overlay ring</title>
<desc id="d">goat-transformers, public, at core.ref 9722950, holds the engines, the shared model and the public packs such as geojson. Around it, a dashed ring is this private overlay: twelve fictional formats (xtdl-armor-example, xtdl-b-example, xtdl-example, xtdl-flag-example, xtdl-frame-example, xtdl-gated-example, xtdl-json-example, xtdl-report-example, xtdl-set-example, xtdl-text-example, xtdl-track-example, xtdl-values-example) and the model module xtdl, all marked distribution controlled. Every format connects to the same shared model. An engine started with --max-distribution public loads nothing from the overlay.</desc>
<style>
  .ink{fill:#e6edf3} .quiet{fill:#9198a1} .pub{fill:#4493f8} .ovl{fill:#d29922}
  .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .box{fill:#4493f8;fill-opacity:.14;stroke:#4493f8;stroke-width:1.5}
  .hub{fill:#4493f8;fill-opacity:.28;stroke:#4493f8;stroke-width:2}
  .obox{fill:#d29922;fill-opacity:.14;stroke:#d29922;stroke-width:1.5;stroke-dasharray:6 4}
  .ring{fill:none;stroke:#4493f8;stroke-width:1.5}
  .oring{fill:none;stroke:#d29922;stroke-width:1.5;stroke-dasharray:8 6}
  .ln{stroke:#4493f8;stroke-width:1.5;fill:none}
  .oln{stroke:#d29922;stroke-width:1.5;fill:none;stroke-dasharray:6 4}
</style>
