<text x="34" y="44" class="t ovl" font-size="14" text-anchor="start" font-weight="600">This repository, the private overlay: twelve fictional formats and the model module xtdl</text>
<rect x="220" y="72" width="440" height="456" rx="14" class="ring"/>
<text x="238" y="100" class="t pub" font-size="14" text-anchor="start" font-weight="600">goat-transformers, public, at core.ref 9722950</text>
