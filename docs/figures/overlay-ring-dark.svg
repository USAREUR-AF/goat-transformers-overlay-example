<rect x="298" y="192" width="284" height="236" rx="12" class="hub"/>
<text x="440" y="224" class="t ink" font-size="19" text-anchor="middle" font-weight="600">shared model</text>
<text x="440" y="250" class="t quiet" font-size="13" text-anchor="middle" font-weight="600">public keys the overlay maps</text>
<text x="440" y="320" class="t ovl" font-size="13" text-anchor="middle" font-weight="600">module xtdl, controlled</text>
<text x="440" y="270" class="m quiet" font-size="13" text-anchor="middle">lat lon speed_ms callsign</text>
<text x="440" y="288" class="m quiet" font-size="13" text-anchor="middle">time_ms uid</text>
<text x="440" y="340" class="m ovl" font-size="13" text-anchor="middle">sector status day_s contacts</text>
<text x="440" y="358" class="m ovl" font-size="13" text-anchor="middle">contact_id bearing_deg range_m</text>
<text x="440" y="376" class="m ovl" font-size="13" text-anchor="middle">position_sent lane_offset_m t_s</text>
<text x="440" y="394" class="m ovl" font-size="13" text-anchor="middle">t_ns ecef_x_m ecef_y_m ecef_z_m</text>
<text x="440" y="412" class="m ovl" font-size="13" text-anchor="middle">geoid_m h_msl_m</text>
<text x="440" y="454" class="t ink" font-size="14" text-anchor="middle">Overlay packs map a public key wherever one fits,</text>
<text x="440" y="474" class="t ink" font-size="14" text-anchor="middle">so they convert to and from the public formats.</text>
<text x="440" y="498" class="t quiet" font-size="14" text-anchor="middle">The engines are not copied or changed.</text>
<text x="440" y="552" class="t ovl" font-size="14" text-anchor="middle">An engine started with --max-distribution public loads nothing from the dashed ring.</text>
</svg>
