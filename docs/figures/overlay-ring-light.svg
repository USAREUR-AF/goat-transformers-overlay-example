<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 647" width="880" height="647" role="img" aria-labelledby="t d">
<title id="t">Sixteen fictional formats fill the private overlay ring</title>
<desc id="d">goat-transformers, public, at core.ref 7548601, holds the engines, the shared model and the public packs such as geojson. Around it, a dashed ring is this private overlay: sixteen fictional formats (xtdl-armor-example, xtdl-asn1-example, xtdl-b-example, xtdl-example, xtdl-flag-example, xtdl-frame-example, xtdl-gated-example, xtdl-json-example, xtdl-list-example, xtdl-report-example, xtdl-set-example, xtdl-switch-example, xtdl-text-ends-example, xtdl-text-example, xtdl-track-example, xtdl-values-example) and the model module xtdl, all marked distribution controlled. Every format connects to the same shared model. An engine started with --max-distribution public loads nothing from the overlay.</desc>
<style>
  .ink{fill:#1f2328} .quiet{fill:#59636e} .pub{fill:#0969da} .ovl{fill:#9a6700}
  .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .box{fill:#0969da;fill-opacity:.08;stroke:#0969da;stroke-width:1.5}
  .hub{fill:#0969da;fill-opacity:.18;stroke:#0969da;stroke-width:2}
  .obox{fill:#9a6700;fill-opacity:.08;stroke:#9a6700;stroke-width:1.5;stroke-dasharray:6 4}
  .ring{fill:none;stroke:#0969da;stroke-width:1.5}
  .oring{fill:none;stroke:#9a6700;stroke-width:1.5;stroke-dasharray:8 6}
  .ln{stroke:#0969da;stroke-width:1.5;fill:none}
  .oln{stroke:#9a6700;stroke-width:1.5;fill:none;stroke-dasharray:6 4}
</style>
