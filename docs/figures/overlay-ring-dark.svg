<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 592" width="880" height="592" role="img" aria-labelledby="t d">
<title id="t">Eleven fictional formats fill the private overlay ring</title>
<desc id="d">goat-transformers, public, at core.ref 04bd340, holds the engines, the shared model and the public packs such as geojson. Around it, a dashed ring is this private overlay: eleven fictional formats (xtdl-armor-example, xtdl-b-example, xtdl-example, xtdl-flag-example, xtdl-frame-example, xtdl-gated-example, xtdl-json-example, xtdl-set-example, xtdl-text-example, xtdl-track-example, xtdl-values-example) and the model module xtdl, all marked distribution controlled. Every format connects to the same shared model. An engine started with --max-distribution public loads nothing from the overlay.</desc>
<style>
  .ink{fill:#e6edf3} .quiet{fill:#9198a1} .pub{fill:#4493f8} .ovl{fill:#d29922}
  .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .box{fill:#4493f8;fill-opacity:.14;stroke:#4493f8;stroke-width:1.5}
  .hub{fill:#4493f8;fill-opacity:.28;stroke:#4493f8;stroke-width:2}
  .obox{fill:#d29922;fill-opacity:.14;stroke:#d29922;stroke-width:1.5;stroke-dasharray:6 4}
  .ring{fill:none;stroke:#4493f8;stroke-width:1.5}
  .oring{fill:none;stroke:#d29922;stroke-width:1.5;stroke-dasharray:8 6}
  .ln{stroke:#4493f8;stroke-width:1.5;fill:none}
  .oln{stroke:#d29922;stroke-width:1.5;fill:none;stroke-dasharray:6 4}
</style>
<rect x="16" y="16" width="848" height="560" rx="18" class="oring"/>
<text x="34" y="44" class="t ovl" font-size="14" text-anchor="start" font-weight="600">This repository, the private overlay: eleven fictional formats and the model module xtdl</text>
<rect x="220" y="72" width="440" height="440" rx="14" class="ring"/>
<text x="238" y="100" class="t pub" font-size="14" text-anchor="start" font-weight="600">goat-transformers, public, at core.ref 04bd340</text>
